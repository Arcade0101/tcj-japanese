<style>
:root{
  --paper:#FBFAF6; --surface:#FFFFFF; --ink:#15181E; --muted:#5C6272; --faint:#8A8F9C;
  --line:#E4E1D8; --line-soft:#EFEDE6;
  --indigo:#2C4370; --indigo-soft:#E8EDF7;
  --vermilion:#B8402A; --vermilion-soft:#FBEAE5;
  --good:#2C6B4F; --good-soft:#E6F2EB;
  --hl-y:#FFF08A;
  --ja:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --en:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14161A; --surface:#1B1E24; --ink:#E9E7E1; --muted:#A0A6B4; --faint:#7A8090;
    --line:#2B2F38; --line-soft:#232730;
    --indigo:#93B3E8; --indigo-soft:#1C2635;
    --vermilion:#F0937B; --vermilion-soft:#2E1F1B;
    --good:#6FC79A; --good-soft:#17281F;
    --hl-y:rgba(255,224,90,.24);
  }
}
:root[data-theme="dark"]{
  --paper:#14161A; --surface:#1B1E24; --ink:#E9E7E1; --muted:#A0A6B4; --faint:#7A8090;
  --line:#2B2F38; --line-soft:#232730;
  --indigo:#93B3E8; --indigo-soft:#1C2635;
  --vermilion:#F0937B; --vermilion-soft:#2E1F1B;
  --good:#6FC79A; --good-soft:#17281F;
  --hl-y:rgba(255,224,90,.24);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--en);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.ja,.stem,.opt-t,h1,h2,h3{font-family:var(--ja)}

/* header */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:820px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar .ttl{font-family:var(--ja);font-weight:600;font-size:15px;margin-right:auto}
.count{font-family:var(--en);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{flex:1 1 90px;min-width:70px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;max-width:180px}
.meter i{display:block;height:100%;width:0;background:var(--indigo);transition:width .2s}
button{font-family:var(--en);cursor:pointer}
.btn{font-size:13px;font-weight:600;letter-spacing:.02em;padding:7px 16px;border-radius:999px;border:1px solid var(--indigo);background:var(--indigo);color:var(--paper);transition:opacity .15s}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--indigo)}
.btn:focus-visible{outline:2px solid var(--vermilion);outline-offset:2px}

main{max-width:820px;margin:0 auto;padding:0 20px 90px}

/* intro */
.intro{padding:30px 0 4px}
.intro h1{font-size:28px;margin:0 0 6px;font-weight:600;text-wrap:balance}
.intro .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.specs div{background:var(--surface);padding:11px 14px}
.specs .k{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:block}
.specs .v{font-family:var(--ja);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.specs .v.pass{color:var(--vermilion)}

/* result banner */
#result{display:none;margin:22px 0 0;border:1px solid var(--line);border-left:4px solid var(--indigo);background:var(--surface);padding:18px 20px}
#result.show{display:block}
#result.pass{border-left-color:var(--good);background:var(--good-soft)}
#result.fail{border-left-color:var(--vermilion);background:var(--vermilion-soft)}
#result .verdict{font-family:var(--ja);font-size:22px;font-weight:600;margin:0}
#result .score{font-family:var(--en);font-size:40px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;margin:4px 0 0}
#result .score small{font-size:17px;font-weight:500;color:var(--muted)}
#result .msg{font-size:14px;color:var(--ink);margin:8px 0 0}
#result .weak{margin:14px 0 0;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent);font-size:13.5px}
#result .weak b{font-family:var(--ja)}
#result ul{margin:6px 0 0;padding-left:18px}
#result li{margin:3px 0}

/* mondai */
.mondai{padding-top:34px}
.mondai>h2{font-size:17px;margin:0;font-weight:600;display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:7px}
.mondai>h2 .rng{font-family:var(--en);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--faint);margin-left:auto}
.mondai>.inst{font-family:var(--ja);font-size:14px;color:var(--muted);margin:9px 0 0;line-height:1.75}
.passage{font-family:var(--ja);font-size:16px;line-height:2.05;background:var(--surface);border:1px solid var(--line);padding:16px 18px;margin:14px 0 0}
.passage p{margin:0 0 10px}
.passage p:last-child{margin:0}
.passage b{background:var(--hl-y);padding:0 .2em;border-radius:2px;font-weight:600;color:var(--ink)}

/* question */
.q{border-bottom:1px solid var(--line-soft);padding:16px 0 16px 14px;border-left:3px solid transparent}
.q.ok{border-left-color:var(--good);background:color-mix(in srgb,var(--good) 5%,transparent)}
.q.ng{border-left-color:var(--vermilion);background:color-mix(in srgb,var(--vermilion) 5%,transparent)}
.q .no{font-family:var(--en);font-size:11px;font-weight:600;letter-spacing:.09em;color:var(--vermilion);font-variant-numeric:tabular-nums}
.stem{font-size:17px;line-height:1.95;margin:2px 0 0}
.stem u{text-decoration:none;background:var(--hl-y);padding:0 .15em;border-radius:2px;font-weight:600;color:var(--ink)}
.stem .blank{display:inline-block;min-width:3.4em;border-bottom:1.5px solid var(--ink);text-align:center}
.stem .star{color:var(--vermilion);font-weight:600}
.opts{list-style:none;margin:9px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:6px}
.opts label{
  display:flex;align-items:baseline;gap:9px;padding:8px 12px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-size:15px;transition:border-color .12s,background .12s;
}
.opts label:hover{border-color:var(--indigo)}
.opts input{position:absolute;opacity:0;width:0;height:0}
.opts .num{font-family:var(--en);font-size:11.5px;font-weight:600;color:var(--faint);min-width:1em}
.opt-t{line-height:1.6}
.opts label:has(input:checked){border-color:var(--indigo);background:var(--indigo-soft)}
.opts label:has(input:focus-visible){outline:2px solid var(--vermilion);outline-offset:1px}
.graded .opts label{cursor:default}
.graded .opts label.correct{border-color:var(--good);background:var(--good-soft)}
.graded .opts label.chosen-wrong{border-color:var(--vermilion);background:var(--vermilion-soft)}
.graded .opts label .num::after{content:""}
.graded .opts label.correct .num::after{content:" ✓";color:var(--good)}
.graded .opts label.chosen-wrong .num::after{content:" ✗";color:var(--vermilion)}
.why{display:none;margin:9px 0 0;padding:10px 13px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.graded .why{display:block}
.why b{font-family:var(--ja);color:var(--ink);font-weight:600}

/* submit */
.submit-wrap{margin-top:34px;padding-top:22px;border-top:2px solid var(--ink);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.submit-wrap .hint{font-size:13px;color:var(--muted)}
.btn.big{font-size:15px;padding:11px 26px}

@media (max-width:620px){
  .opts{grid-template-columns:1fr}
  .intro h1{font-size:23px}
  .bar .ttl{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  {s:'電車が（　）ので、会社に 遅れます。',o:["来ません","来ない","来なくて","来ないだ"],a:2,w:'動詞は <b>ふつう形</b>。ていねい形（来ません）は ので の前に 来ない。'},
  {s:'すみません、頭が 痛い（　）、早く 帰っても いいですか。',o:["から","ので","ないで","ても"],a:2,w:'お願いするとき・謝るときは <b>ので</b>。「から」より ていねい（P65）。'},
  {s:'1時間（　）、パフェを 食べます。',o:["待ったら","待たないで","待っても","待つ場合は"],a:3,w:'<b>〜ても</b> — ふつうは あきらめるのに 食べる ＝ 反対の けっか。'},
  {s:'あしたは 試験なので、（　）勉強します。',o:["寝て","寝ないで","寝たら","寝ても"],a:2,w:'<b>Vナイ形＋で</b> — 寝ないで＝without sleeping。'},
  {s:'地震が 起きた（　）、つくえの 下に 入って ください。',o:["ても","ないで","すぎ","場合は"],a:4,w:'<b>場合は</b> — ルールや しじの とき つかう。'},
  {s:'熱が ある（　）、学校を 休みます。',o:["ので","ても","ないで","かもしれません"],a:1,w:'<b>ので</b> — やわらかい りゆう。から より ていねい。'},
  {s:'この ズボンは（　）。入りません。',o:["小さいすぎます","小さすぎます","小さくすぎます","小さなすぎます"],a:2,w:'い形容詞は <b>い</b>を とって すぎます。小さ＋すぎます。'},
  {s:'スマホ（　）見すぎですよ。',o:["が","を","に","の"],a:4,w:'〔名詞〕<b>の</b>〔Vます形〕すぎ — スマホ<b>の</b>見すぎ。'},
  {s:'携帯で 調べ（　）、わかります。',o:["ても","ないで","たら","ので"],a:3,w:'<b>〜たら</b> — きたいどおりの けっか（わかる）。ても なら「わかりません」。'},
  {s:'あしたの 授業は（　）かもしれません。',o:["オンラインだ","オンラインな","オンライン","オンラインの"],a:3,w:'名詞は <b>そのまま</b> つける。✗ オンライン<b>だ</b>かもしれません。'}
 ]},
 {t:"もんだい6　文の文法2（文の組み立て）",r:"Q45–47",i:"★ に 入る ものは どれですか。1・2・3・4から 一つ えらんで ください。",q:[
  {s:'あした <span class="blank"></span> <span class="blank"></span> <span class="blank star">★</span> <span class="blank"></span> 行きます。',o:["うみへ","雨が","かならず","ふっても"],a:3,w:'ただしい じゅんばん：あした <b>雨が → ふっても → ★かならず → うみへ</b> 行きます。'},
  {s:'この <span class="blank"></span> <span class="blank star">★</span> <span class="blank"></span> <span class="blank"></span> 入りません。',o:["すぎますから","小さ","ズボンは","ちょっと"],a:4,w:'ただしい じゅんばん：この <b>ズボンは → ★ちょっと → 小さ → すぎますから</b> 入りません。'},
  {s:'かばんの 中に <span class="blank"></span> <span class="blank"></span> <span class="blank star">★</span> <span class="blank"></span> かもしれません。',o:["おとした","さいふが","どこかで","ないので"],a:3,w:'ただしい じゅんばん：かばんの中に <b>さいふが → ないので → ★どこかで → おとした</b> かもしれません。'}
 ]},
 {t:"もんだい7　文章の文法",r:"Q48–50",i:"つぎの 文章を 読んで、（48）から（50）に 入る いちばん いい ものを 1・2・3・4から 一つ えらんで ください。",
  p:'<p>きのう、会社からの 帰り道、急に 雨が ふり出しました。いつもは 駅から 歩いて 帰りますが、急いで いたので、タクシーに（ <b>48</b> ）。でも、雨で 道が とても 渋滞して いました。家まで 20分も かかりました。歩いた ほうが 早かったと 思います。</p><p>　家に 着いてから、おなかが すいて いたので、ごはんを（ <b>49</b> ）。そのあと、おなかが いたく なりました。もしかしたら、食中毒（ <b>50</b> ）。</p>',
  q:[
  {s:'（ 48 ）',o:["乗りません","乗って ください","乗りました","乗るでしょう"],a:3,w:'「きのう」の はなしなので <b>かこけい</b>。'},
  {s:'（ 49 ）',o:["食べて すぎました","食べすぎました","食べる すぎました","食べなすぎました"],a:2,w:'〔Vます形〕＋すぎ の かこけい ＝ <b>食べすぎました</b>。'},
  {s:'（ 50 ）',o:["だかもしれません","かもしれません","でかもしれません","にかもしれません"],a:2,w:'名詞＋<b>かもしれません</b>。✗ 食中毒<b>だ</b>かもしれません。'}
 ]}
];

var WEAK=[
 {lo:1,hi:8,label:"漢字の 読み — 駅・電・急・道・乗（くんよみ／おんよみ）"},
 {lo:9,hi:14,label:"漢字の 書き — にている かたちに 気を つける"},
 {lo:15,hi:24,label:"ことば — U173・174・175・178 と P62–65"},
 {lo:25,hi:28,label:"いみの りかい — 〜ないで／場合は／〜ても／〜すぎ"},
 {lo:29,hi:32,label:"9/14 〜たほうがいいです／〜ないほうがいいです（た形 と ない形）"},
 {lo:33,hi:36,label:"9/14 〜ので（な形容詞・名詞は な が いる）と「から」との ちがい"},
 {lo:37,hi:44,label:"ぶんぽうの かたち — 〜ても／〜たら／〜すぎ／〜かもしれません"},
 {lo:45,hi:47,label:"語順 — 文の 組み立て"},
 {lo:48,hi:50,label:"文章の中の ぶんぽう — じかん（かこけい）と せつぞく"}
];

var TOTAL=50, PASS=45;
var flat=[], host=document.getElementById("quiz"), n=0, html="";

SECTIONS.forEach(function(sec){
  html+='<div class="mondai"><h2>'+sec.t+'<span class="rng">'+sec.r+'</span></h2><p class="inst">'+sec.i+'</p>';
  if(sec.p) html+='<div class="passage">'+sec.p+'</div>';
  sec.q.forEach(function(q){
    n++; flat.push(q);
    html+='<div class="q" id="q'+n+'"><span class="no">'+n+'</span><p class="stem">'+q.s+'</p><ul class="opts">';
    q.o.forEach(function(op,i){
      html+='<li><label><input type="radio" name="q'+n+'" value="'+(i+1)+'"><span class="num">'+(i+1)+'</span><span class="opt-t">'+op+'</span></label></li>';
    });
    html+='</ul><div class="why">'+q.w+'</div></div>';
  });
  html+='</div>';
});
host.innerHTML=html;

var btnMain=document.getElementById("btnMain"),btnTop=document.getElementById("btnTop"),
    btnReset=document.getElementById("btnReset"),hint=document.getElementById("hint"),
    cAns=document.getElementById("cAns"),meter=document.getElementById("meterFill"),
    box=document.getElementById("result"),graded=false;

function answered(){var c=0;for(var i=1;i<=TOTAL;i++){if(document.querySelector('input[name="q'+i+'"]:checked'))c++;}return c;}
function refresh(){
  var a=answered();
  cAns.textContent=a;
  meter.style.width=(a/TOTAL*100)+"%";
  var ready=(a===TOTAL)&&!graded;
  btnMain.disabled=!ready; btnTop.disabled=!ready;
  hint.textContent=graded?"":(a===TOTAL?"ぜんぶ こたえました。さいてんして ください。":"のこり "+(TOTAL-a)+"問。");
}
host.addEventListener("change",function(e){if(e.target.type==="radio"&&!graded)refresh();});

function grade(){
  if(graded)return;
  graded=true;
  var score=0,wrong=[];
  for(var i=1;i<=TOTAL;i++){
    var q=flat[i-1],el=document.getElementById("q"+i),
        pick=document.querySelector('input[name="q'+i+'"]:checked'),
        val=pick?parseInt(pick.value,10):0;
    el.classList.add("graded");
    var labels=el.querySelectorAll(".opts label");
    labels[q.a-1].classList.add("correct");
    if(val===q.a){score++;el.classList.add("ok");}
    else{el.classList.add("ng");wrong.push(i);if(val)labels[val-1].classList.add("chosen-wrong");}
    el.querySelectorAll('input').forEach(function(inp){inp.disabled=true;});
  }
  var pct=Math.round(score/TOTAL*100),pass=score>=PASS;
  var areas=WEAK.filter(function(w){return wrong.some(function(x){return x>=w.lo&&x<=w.hi;});});
  var msg = pass ? "ないようを 理解して います。9月25日の じゅぎょうへ すすんで ください。"
    : (score>=32 ? "あと 少しです。まちがえた ところだけ ふくしゅうして、もう一度 やって みて ください。"
    : (score>=28 ? "〜ても／〜たら の ちがいと、〜すぎ の 3つの パターンを もう一度 かくにん して ください。"
    : "復習シートを ぜんぶ 読んでから、もう一度 テストして ください。"));
  var h='<p class="verdict">'+(pass?"🎉 ごうかく":"ふごうかく")+'</p>'
      + '<p class="score">'+score+'<small> / '+TOTAL+'　（'+pct+'%）</small></p>'
      + '<p class="msg">'+msg+'　ごうかくラインは '+PASS+'点（90%）です。</p>';
  if(wrong.length){
    h+='<div class="weak"><b>ふくしゅうする ところ</b><ul>';
    areas.forEach(function(a){h+='<li>'+a.label+'</li>';});
    h+='</ul><div style="margin-top:6px;color:var(--muted)">まちがえた もんだい：'+wrong.join("、")+'</div></div>';
  }
  box.innerHTML=h;
  box.className="show "+(pass?"pass":"fail");
  btnMain.hidden=true;btnTop.hidden=true;btnReset.hidden=false;
  hint.textContent="下に ✓ と ✗ と せつめいが 出て います。";
  box.scrollIntoView({behavior:"smooth",block:"center"});
}
btnMain.addEventListener("click",grade);
btnTop.addEventListener("click",grade);
btnReset.addEventListener("click",function(){location.reload();});
refresh();
</script>
